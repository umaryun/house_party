<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080" />
    <title>House Party · launch video</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet" />
    <script>
      // Deterministic virtual clock + seeded randomness so every frame renders identically.
      (function () {
        let vnow = 0;
        let rafId = 0;
        const raf = new Map();
        performance.now = () => vnow;
        const base = 1760000000000;
        Date.now = () => base + vnow;
        window.requestAnimationFrame = (cb) => (raf.set(++rafId, cb), rafId);
        window.cancelAnimationFrame = (id) => raf.delete(id);
        window.__clock = {
          set(ms) { vnow = ms; },
          flush() {
            const cbs = [...raf.values()];
            raf.clear();
            for (const cb of cbs) cb(vnow);
          },
        };
        let s = 20261009;
        Math.random = () => {
          s |= 0; s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      })();
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
